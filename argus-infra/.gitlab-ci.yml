# =============================================================================
# argus-infra — GitLab CI/CD Entry Point
#
# Delegates to the comprehensive pipeline definition in ci/gitlab-ci.yml.
# This file exists at repo root because GitLab requires .gitlab-ci.yml here.
#
# Pipeline stages: validate → sync/reset → migrate (manual SSH gates)
# See ci/gitlab-ci.yml for full job definitions.
# =============================================================================

include:
  - local: 'ci/gitlab-ci.yml'
