# =============================================================================
#  coturn configuration for Argus AI / LiveKit TURN relay
#
#  Replace <TURN_SECRET>, <TURN_REALM>, and <EXTERNAL_IP> before deploying.
#  These can also be templated via envsubst in the deploy script.
# =============================================================================

# Listening ports
listening-port=3478
tls-listening-port=5349

# External IP (public IP of the server — required for NAT traversal)
external-ip=TURN_EXTERNAL_IP

# Relay IP (usually same as external, unless dual-NIC)
relay-ip=TURN_EXTERNAL_IP

# Realm (your domain)
realm=TURN_REALM

# Use time-limited credentials (HMAC-SHA1, compatible with LiveKit)
use-auth-secret
static-auth-secret=TURN_SECRET

# Relay port range (open in firewall: UDP 49152-65535)
min-port=49152
max-port=65535

# TLS certificate paths (optional, for TLS TURN on port 5349)
# cert=/etc/coturn/certs/fullchain.pem
# pkey=/etc/coturn/certs/privkey.pem

# Security
no-multicast-peers
no-rfc5780
no-stun-backward-compatibility
response-origin-only-with-rfc5780

# Logging
log-file=/var/log/coturn/turnserver.log
verbose

# Disable legacy protocols
no-tlsv1
no-tlsv1_1

# Fingerprint for WebRTC compatibility
fingerprint
