# =============================================================================
#  Argus AI — Redis 7 Production Configuration
#
#  Purpose: Durable job queue backing for asynq (video export, forensic PDF,
#  AI analysis). Redis is NOT a cache here — it stores active job state.
#  Data loss = lost jobs = broken export/forensic pipeline.
#
#  Key invariants:
#    1. AOF + RDB dual persistence — AOF for durability, RDB for fast restart.
#    2. maxmemory-policy noeviction — NEVER silently drop job data.
#    3. appendfsync everysec — 1-second worst-case data loss window.
# =============================================================================

# ── Persistence: Append-Only File (primary durability) ──────────────────────
appendonly yes
appendfsync everysec
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
aof-use-rdb-preamble yes

# ── Persistence: RDB Snapshots (fast-restart complement) ────────────────────
# Snapshot triggers: 900s/1 change, 300s/10 changes, 60s/10000 changes
save 900 1
save 300 10
save 60 10000
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# ── Memory Management ───────────────────────────────────────────────────────
# CRITICAL: noeviction ensures asynq job data is NEVER silently dropped.
# If memory is full, Redis returns OOM errors — the application handles this
# via asynq's retry mechanism rather than losing jobs.
maxmemory 4gb
maxmemory-policy noeviction

# ── Connection Handling ─────────────────────────────────────────────────────
tcp-backlog 511
timeout 300
tcp-keepalive 60
maxclients 1000

# ── Performance ─────────────────────────────────────────────────────────────
hz 10
dynamic-hz yes
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
lazyfree-lazy-user-del yes

# ── Logging ─────────────────────────────────────────────────────────────────
loglevel notice

# ── Security ────────────────────────────────────────────────────────────────
# Password is set via --requirepass flag in docker-compose or REDIS_PASSWORD env.
# Protected mode is disabled because Redis is behind Docker network isolation.
protected-mode no

# ── Slow Log ────────────────────────────────────────────────────────────────
slowlog-log-slower-than 10000
slowlog-max-len 128
