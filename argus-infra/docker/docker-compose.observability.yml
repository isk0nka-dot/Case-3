# =============================================================================
#  Argus AI — Observability Add-on
#
#  Запуск поверх основного стека:
#    docker compose -f docker-compose.dev.yml -f docker-compose.observability.yml up -d
#
#  Или в production:
#    docker compose -f docker-compose.yaml -f docker-compose.observability.yml up -d
#
#  Доступ:
#    Prometheus : http://localhost:9090
#    Grafana    : http://localhost:3001  (admin / argus-grafana-2026)
# =============================================================================

networks:
  argus-dev:
    external: true
    name: argus-dev-network

volumes:
  prometheus-data:
  grafana-data:

services:

  # ── Prometheus ────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: argus-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
      - "--web.enable-remote-write-receiver"
    ports:
      - "9090:9090"
    volumes:
      - ../observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    networks:
      - argus-dev
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── Grafana ───────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.3
    container_name: argus-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-argus-grafana-2026}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=%(protocol)s://%(domain)s:%(http_port)s/grafana
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/dashboards/argus-overview.json
    volumes:
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../observability/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks:
      - argus-dev
    depends_on:
      - prometheus
    restart: unless-stopped

  # ── Node Exporter (host system metrics) ───────────────────────────────────
  node-exporter:
    image: prom/node-exporter:v1.8.1
    container_name: argus-node-exporter
    command:
      - "--path.rootfs=/host"
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host:ro,rslave
    networks:
      - argus-dev
    restart: unless-stopped
    pid: host

  # ── Redis Exporter ─────────────────────────────────────────────────────────
  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0
    container_name: argus-redis-exporter
    environment:
      - REDIS_ADDR=redis://redis:6379
    networks:
      - argus-dev
    restart: unless-stopped

  # ── PostgreSQL Exporter ────────────────────────────────────────────────────
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: argus-postgres-exporter
    environment:
      - DATA_SOURCE_NAME=postgresql://argus:${POSTGRES_PASSWORD:-argus-db-secret}@postgres:5432/argus?sslmode=disable
    networks:
      - argus-dev
    restart: unless-stopped
