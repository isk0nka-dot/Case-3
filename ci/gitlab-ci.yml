# =============================================================================
# argus-frontend — GitLab CI/CD Pipeline
# =============================================================================
#
# Pipeline: verify → build → deploy
#
#   verify:  npm ci, lint, typecheck
#   build:   nuxt build → produces .output/
#   deploy:  rsync .output + Dockerfile to server, docker build, docker compose up
#
# Required CI variables (project or group level):
#   DEPLOY_HOST       Production server IP
#   DEPLOY_USER       SSH user (e.g. deploy)
#   DEPLOY_SSH_KEY    SSH private key (type: File, protected + masked)
#
# Optional CI variables:
#   NUXT_PUBLIC_API_URL   Backend API URL (default: https://argusai.kz/api)
# =============================================================================

image: node:22-alpine

stages:
  - verify
  - build
  - deploy

variables:
  NPM_CACHE: ${CI_PROJECT_DIR}/.npm-cache

cache:
  key: npm-${CI_COMMIT_REF_SLUG}
  paths:
    - .npm-cache/
    - node_modules/

# ── Stage: verify ────────────────────────────────────────────────────────────

install:
  stage: verify
  before_script:
    - npm config set cache ${NPM_CACHE}
  script:
    - npm ci --ignore-scripts
  artifacts:
    paths:
      - node_modules/
    expire_in: 1 hour
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

lint:
  stage: verify
  needs: [install]
  script:
    - npx nuxt prepare
    - npm run lint
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

typecheck:
  stage: verify
  needs: [install]
  script:
    - npx nuxt prepare
    - npm run typecheck
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

# ── Stage: build ─────────────────────────────────────────────────────────────
# Runs `nuxt build` to produce the .output/ directory.
# The .output/ artifact is passed to the deploy job.

build-production:
  stage: build
  needs: [install]
  before_script:
    - npm config set cache ${NPM_CACHE}
  script:
    - |
      # Set the API URL — falls back to the production default if not set.
      export NUXT_PUBLIC_API_URL="${NUXT_PUBLIC_API_URL:-https://argusai.kz/api}"
      echo "→ Building Nuxt app (API: ${NUXT_PUBLIC_API_URL})..."
      npm run build
      echo "→ Build complete. Output size:"
      du -sh .output/
  artifacts:
    paths:
      - .output/
    expire_in: 1 hour
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

# ── Stage: deploy ─────────────────────────────────────────────────────────────
# Rsync the freshly-built .output/ and Dockerfile to the server,
# rebuild the Docker image, then restart the frontend container.

deploy-production:
  stage: deploy
  image: alpine:3.20
  needs:
    - job: build-production
      artifacts: true
    - job: typecheck
    - job: lint
      optional: true
  before_script:
    - apk add --no-cache openssh-client rsync
    - eval $(ssh-agent -s)
    - chmod 600 "${DEPLOY_SSH_KEY}"
    - ssh-add "${DEPLOY_SSH_KEY}"
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -H ${DEPLOY_HOST} >> ~/.ssh/known_hosts 2>/dev/null
  script:
    - |
      SERVICE="frontend"
      BUILD_DIR="/home/${DEPLOY_USER}/builds/${SERVICE}"

      echo "═══════════════════════════════════════════════════════════"
      echo "  Deploying frontend to ${DEPLOY_HOST}"
      echo "  Commit: ${CI_COMMIT_SHORT_SHA}"
      echo "═══════════════════════════════════════════════════════════"

      # Step 1: Rsync .output/ + Dockerfile to server (writable build dir)
      echo "→ Syncing built artifacts to ${BUILD_DIR}..."
      ssh -o StrictHostKeyChecking=no ${DEPLOY_USER}@${DEPLOY_HOST} "mkdir -p ${BUILD_DIR}"
      rsync -azO --delete \
        --exclude='/.git' \
        --exclude='/node_modules' \
        --exclude='/.npm-cache' \
        --exclude='/.nuxt' \
        ${CI_PROJECT_DIR}/ \
        ${DEPLOY_USER}@${DEPLOY_HOST}:${BUILD_DIR}/

      # Step 2: Build Docker image on server, then restart container via compose
      echo "→ Rebuilding Docker container..."
      ssh -o StrictHostKeyChecking=no ${DEPLOY_USER}@${DEPLOY_HOST} "
        set -e
        cd ${BUILD_DIR}
        docker build --no-cache -t argus/${SERVICE}:latest -f Dockerfile . 2>&1

        cd /opt/argus/docker
        docker compose up -d --no-deps --no-build ${SERVICE} 2>&1

        echo '→ Waiting for container to become healthy...'
        for i in \$(seq 1 20); do
          sleep 6
          health=\$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}no-healthcheck{{end}}' argus-${SERVICE} 2>/dev/null)
          if [ \"\$health\" = 'healthy' ]; then
            echo \"✓ Container healthy after \$((i * 6))s\"
            exit 0
          fi
          echo \"  Attempt \$i/20: health=\$health\"
        done
        echo 'DEPLOY FAILED: container did not become healthy'
        docker logs --tail=30 argus-${SERVICE} 2>&1
        exit 1
      "

      echo "═══════════════════════════════════════════════════════════"
      echo "  ✓ DEPLOY SUCCESS: frontend (${CI_COMMIT_SHORT_SHA})"
      echo "═══════════════════════════════════════════════════════════"
  environment:
    name: production
    url: https://argusai.kz
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
