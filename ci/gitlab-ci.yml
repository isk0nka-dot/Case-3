# =============================================================================
# argus-frontend — GitLab CI/CD Pipeline
# =============================================================================
#
# Pipeline: verify → deploy
#
#   verify (runs on GitLab shared Docker runners):
#     npm install, lint, typecheck
#
#   deploy (rsync code to server + rebuild Docker):
#     1. rsync repo (with pre-built .output/) to server
#     2. SSH to server: docker compose build + up
#
# Required CI variables (project or group level):
#   DEPLOY_HOST       Production server IP
#   DEPLOY_USER       SSH user (e.g. deploy)
#   DEPLOY_SSH_KEY    SSH private key (type: File, protected + masked)
# =============================================================================

image: node:22-alpine

stages:
  - verify
  - deploy

variables:
  NPM_CACHE: ${CI_PROJECT_DIR}/.npm-cache

cache:
  key: npm-${CI_COMMIT_REF_SLUG}
  paths:
    - .npm-cache/
    - node_modules/

# ── Stage: verify ────────────────────────────────────────────────────────────

install:
  stage: verify
  before_script:
    - npm config set cache ${NPM_CACHE}
  script:
    - npm ci --ignore-scripts
  artifacts:
    paths:
      - node_modules/
    expire_in: 1 hour
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

lint:
  stage: verify
  needs: [install]
  script:
    - npx nuxt prepare
    - npm run lint
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

typecheck:
  stage: verify
  needs: [install]
  script:
    - npx nuxt prepare
    - npm run typecheck
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

# ── Stage: deploy ────────────────────────────────────────────────────────────
# Rsync the pre-built code to the server, then rebuild Docker container.
# Bypasses git on the server entirely (avoids ownership/permission issues).

deploy-production:
  stage: deploy
  image: alpine:3.20
  needs:
    - job: install
    - job: typecheck
    - job: lint
      optional: true
  before_script:
    - apk add --no-cache openssh-client rsync
    - eval $(ssh-agent -s)
    - chmod 600 "${DEPLOY_SSH_KEY}"
    - ssh-add "${DEPLOY_SSH_KEY}"
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -H ${DEPLOY_HOST} >> ~/.ssh/known_hosts 2>/dev/null
  script:
    - |
      SERVICE="frontend"
      BUILD_DIR="/home/${DEPLOY_USER}/builds/${SERVICE}"

      echo "═══════════════════════════════════════════════════════════"
      echo "  Deploying frontend to ${DEPLOY_HOST}"
      echo "  Commit: ${CI_COMMIT_SHORT_SHA}"
      echo "═══════════════════════════════════════════════════════════"

      # Step 1: Rsync to deploy user's home (writable)
      echo "→ Syncing code to ${BUILD_DIR}..."
      ssh -o StrictHostKeyChecking=no ${DEPLOY_USER}@${DEPLOY_HOST} "mkdir -p ${BUILD_DIR}"
      rsync -azO --delete \
        --exclude='/.git' \
        --exclude='/node_modules' \
        --exclude='/.npm-cache' \
        --exclude='/.nuxt' \
        ${CI_PROJECT_DIR}/ \
        ${DEPLOY_USER}@${DEPLOY_HOST}:${BUILD_DIR}/

      # Step 2: Build Docker image from build dir, then restart via compose
      echo "→ Rebuilding Docker container..."
      ssh -o StrictHostKeyChecking=no ${DEPLOY_USER}@${DEPLOY_HOST} "
        set -e
        cd ${BUILD_DIR}
        docker build --no-cache -t argus/${SERVICE}:latest -f Dockerfile . 2>&1

        cd /opt/argus/docker
        docker compose up -d --no-deps --no-build ${SERVICE} 2>&1

        echo '→ Waiting for container to become healthy...'
        for i in \$(seq 1 20); do
          sleep 6
          health=\$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}no-healthcheck{{end}}' argus-${SERVICE} 2>/dev/null)
          if [ \"\$health\" = 'healthy' ]; then
            echo \"✓ Container healthy after \$((i * 6))s\"
            exit 0
          fi
          echo \"  Attempt \$i/20: health=\$health\"
        done
        echo 'DEPLOY FAILED: container did not become healthy'
        docker logs --tail=20 argus-${SERVICE} 2>&1
        exit 1
      "

      echo "═══════════════════════════════════════════════════════════"
      echo "  ✓ DEPLOY SUCCESS: frontend (${CI_COMMIT_SHORT_SHA})"
      echo "═══════════════════════════════════════════════════════════"
  environment:
    name: production
    url: https://argusai.kz
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
