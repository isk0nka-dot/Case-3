# =============================================================================
# argus-backend — GitLab CI/CD Pipeline
# =============================================================================
#
# Pipeline: verify → deploy
#
#   verify (runs on GitLab shared Docker runners):
#     lint, vet, test (with PostgreSQL service), security scan
#
#   deploy (runs on prod server via shell executor):
#     Calls /opt/argus/scripts/deploy.sh --service=backend
#     → git fetch + reset → migrations → docker compose build → health check
#     → automatic rollback on failure
#
# Trigger rules:
#   - Merge requests: verify only (no deploy)
#   - Push to main:   verify → deploy
#   - Push tag:        verify → deploy
#
# Required CI variables (set at GitLab Group level):
#   DEPLOY_HOST       Production server IP (e.g. 157.180.46.33)
#   DEPLOY_USER       SSH user (e.g. root or deploy)
#   DEPLOY_SSH_KEY    SSH private key (type: File, protected + masked)
#
# No container registry is used. Images build on the server from source.
# All secrets live in /opt/argus/docker/.env — never transiting through CI.
# =============================================================================

image: golang:1.24

stages:
  - verify
  - deploy

variables:
  GO_CACHE: ${CI_PROJECT_DIR}/.go-cache

cache:
  key: go-${CI_COMMIT_REF_SLUG}
  paths:
    - .go-cache/

# ── Stage: verify ────────────────────────────────────────────────────────────
# All verify jobs run on GitLab shared Docker runners (NOT the prod shell runner).
# The default image (golang:1.24-alpine) provides Go toolchain.

lint:
  stage: verify
  before_script:
    - export PATH=$PATH:$(go env GOPATH)/bin
    - curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b $(go env GOPATH)/bin latest
  script:
    - golangci-lint run ./...
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

vet:
  stage: verify
  script:
    - go vet ./...
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

test:
  stage: verify
  services:
    - name: postgres:16-alpine
      alias: postgres
      variables:
        POSTGRES_DB: argus_test
        POSTGRES_USER: argus
        POSTGRES_PASSWORD: argus_test
  variables:
    EVENT_COLLECTOR_PG_HOST: postgres
    EVENT_COLLECTOR_PG_DATABASE: argus_test
    EVENT_COLLECTOR_PG_USERNAME: argus
    EVENT_COLLECTOR_PG_PASSWORD: argus_test
    EVENT_COLLECTOR_JWT_SIGNING_KEY: test-jwt-signing-key-32-chars-ok
    GOFLAGS: "-count=1"
    GOPATH: "${CI_PROJECT_DIR}/.go-cache"
  script:
    - go test -race -coverprofile=coverage.out ./...
    - go tool cover -func=coverage.out | tail -1
  coverage: '/total:\s+\(statements\)\s+(\d+\.\d+)%/'
  artifacts:
    paths:
      - coverage.out
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

security-scan:
  stage: verify
  image: securego/gosec:latest
  script:
    - gosec -fmt sarif -out gosec.sarif ./... || true
  artifacts:
    reports:
      sast: gosec.sarif
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

# ── Stage: deploy ────────────────────────────────────────────────────────────
# SSHes into DEPLOY_HOST and runs deploy.sh remotely.
# This ensures deploys go to the same server as infra sync.

deploy-production:
  stage: deploy
  image: alpine:3.20
  needs:
    - job: lint
      optional: true
    - job: vet
    - job: test
    - job: security-scan
      optional: true      # security-scan is allow_failure, don't block deploy
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - chmod 600 "${DEPLOY_SSH_KEY}"
    - ssh-add "${DEPLOY_SSH_KEY}"
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -H ${DEPLOY_HOST} >> ~/.ssh/known_hosts 2>/dev/null
  script:
    - |
      # Determine git ref for the deploy
      if [ -n "${CI_COMMIT_TAG}" ]; then
        DEPLOY_REF="refs/tags/${CI_COMMIT_TAG}"
        echo "Deploying tag: ${CI_COMMIT_TAG}"
      else
        DEPLOY_REF="origin/${CI_COMMIT_BRANCH}"
        echo "Deploying branch: ${CI_COMMIT_BRANCH} (commit ${CI_COMMIT_SHORT_SHA})"
      fi

      echo "═══════════════════════════════════════════════════════════"
      echo "  Deploying backend via SSH to ${DEPLOY_HOST}"
      echo "  Ref: ${DEPLOY_REF}"
      echo "═══════════════════════════════════════════════════════════"

      ssh -o StrictHostKeyChecking=no ${DEPLOY_USER}@${DEPLOY_HOST} \
        "CI_JOB_TOKEN=${CI_JOB_TOKEN} /opt/argus/scripts/deploy.sh --service=backend --ref=${DEPLOY_REF}"
  environment:
    name: production
    url: https://argusai.kz
  rules:
    # Auto-deploy on version tags (v1.0.0, v2.1.3, etc.)
    - if: $CI_COMMIT_TAG
    # Auto deploy on pushes to main
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
