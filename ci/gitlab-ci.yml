# =============================================================================
# argus-backend — GitLab CI/CD Pipeline
# =============================================================================
#
# Pipeline: verify → deploy
#
#   verify (automatic on MR + main):
#     lint, vet, test (with PostgreSQL service), ai-sidecar-test, security scan
#
#   deploy (MANUAL — нажать кнопку в GitLab UI):
#     rsync code → docker build → docker compose up → health check
#
# Trigger rules:
#   - Merge requests: verify only (no deploy)
#   - Push to main:   verify → deploy (manual gate)
#   - Push tag:       verify → deploy (manual gate)
#
# Required CI variables (set at GitLab Group level):
#   DEPLOY_HOST       Production server IP or DNS name
#   DEPLOY_USER       SSH user (e.g. deploy)
#   DEPLOY_SSH_KEY    SSH private key (prefer type: File, protected)
#
# Optional:
#   ARGUS_PROJECT_ROOT          Default: /opt/argus-ai
#   ARGUS_BACKEND_DEPLOY_PATH   Default: $ARGUS_PROJECT_ROOT/argus-backend
#
# Backward-compatible fallback: ARGUS_DEPLOY_HOST, ARGUS_DEPLOY_USER,
# ARGUS_DEPLOY_SSH_KEY, SSH_PRIVATE_KEY.
# =============================================================================

image: golang:1.26

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

default:
  interruptible: true
  retry:
    max: 1
    when:
      - runner_system_failure
      - stuck_or_timeout_failure

stages:
  - verify
  - deploy

variables:
  GOPATH: ${CI_PROJECT_DIR}/.go
  GOCACHE: ${CI_PROJECT_DIR}/.cache/go-build
  GOFLAGS: "-mod=readonly"

cache:
  key: go-${CI_COMMIT_REF_SLUG}
  paths:
    - .go/pkg/mod/
    - .cache/go-build/

# ── Stage: verify ─────────────────────────────────────────────────────────────

lint:
  stage: verify
  timeout: 10 minutes
  before_script:
    - export PATH=$PATH:$(go env GOPATH)/bin
    - GOFLAGS="" GOBIN="$(go env GOPATH)/bin" go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
  script:
    - golangci-lint run ./...
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

vet:
  stage: verify
  timeout: 5 minutes
  script:
    - go vet ./...
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

test:
  stage: verify
  timeout: 10 minutes
  services:
    - name: postgres:16-alpine
      alias: postgres
      variables:
        POSTGRES_DB: argus_test
        POSTGRES_USER: argus
        POSTGRES_PASSWORD: argus_test
  variables:
    EVENT_COLLECTOR_PG_HOST: postgres
    EVENT_COLLECTOR_PG_DATABASE: argus_test
    EVENT_COLLECTOR_PG_USERNAME: argus
    EVENT_COLLECTOR_PG_PASSWORD: argus_test
    EVENT_COLLECTOR_JWT_SIGNING_KEY: test-jwt-signing-key-32-chars-ok
    GOFLAGS: "-mod=readonly -count=1"
  script:
    - go test -coverprofile=coverage.out ./...
    - go tool cover -func=coverage.out | tail -1
  coverage: '/total:\s+\(statements\)\s+(\d+\.\d+)%/'
  artifacts:
    paths:
      - coverage.out
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

ai-sidecar-test:
  stage: verify
  image: python:3.12-slim
  timeout: 10 minutes
  variables:
    PIP_DISABLE_PIP_VERSION_CHECK: "1"
    PIP_NO_CACHE_DIR: "1"
    PYTHONDONTWRITEBYTECODE: "1"
  before_script:
    - python -m pip install --upgrade pip
    - python -m pip install -r ai-sidecar/requirements.txt -r ai-sidecar/requirements-dev.txt
  script:
    - python -B -m unittest discover ai-sidecar/tests -v
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

security-scan:
  stage: verify
  timeout: 10 minutes
  image:
    name: securego/gosec:latest
    entrypoint: [""]
  script:
    - cd "${CI_PROJECT_DIR}"
    - |
      packages="$(go list ./...)"
      gosec -fmt sarif -out gosec.sarif $packages || true
    - test -s gosec.sarif || printf '%s\n' '{"version":"2.1.0","runs":[]}' > gosec.sarif
  artifacts:
    when: always
    reports:
      sast: gosec.sarif
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

# ── Stage: deploy ─────────────────────────────────────────────────────────────
# Запускается ВРУЧНУЮ через кнопку в GitLab UI после прохождения verify.

deploy-production:
  stage: deploy
  cache: []
  image: alpine:3.20
  timeout: 15 minutes
  needs:
    - job: lint
      optional: true
    - job: vet
    - job: test
    - job: ai-sidecar-test
    - job: security-scan
      optional: true
  before_script:
    - apk add --no-cache openssh-client rsync
  script:
    - sh ci/scripts/deploy_backend.sh
  environment:
    name: production
    url: https://argusai.kz
  rules:
    - if: $CI_COMMIT_TAG
      when: manual
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
