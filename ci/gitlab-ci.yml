# =============================================================================
# argus-backend — GitLab CI/CD Pipeline
# =============================================================================
#
# Pipeline: verify → deploy
#
#   verify (runs on GitLab shared Docker runners):
#     lint, vet, test (with PostgreSQL service), security scan
#
#   deploy (runs on prod server via shell executor):
#     Calls /opt/argus/scripts/deploy.sh --service=backend
#     → git fetch + reset → migrations → docker compose build → health check
#     → automatic rollback on failure
#
# Trigger rules:
#   - Merge requests: verify only (no deploy)
#   - Push to main:   verify → deploy
#   - Push tag:        verify → deploy
#
# Required CI variables (set at GitLab Group level):
#   DEPLOY_HOST       Production server IP (e.g. 157.180.46.33)
#   DEPLOY_USER       SSH user (e.g. root or deploy)
#   DEPLOY_SSH_KEY    SSH private key (type: File, protected + masked)
#
# No container registry is used. Images build on the server from source.
# All secrets live in /opt/argus/docker/.env — never transiting through CI.
# =============================================================================

image: golang:1.26

stages:
  - verify
  - deploy

variables:
  GO_CACHE: ${CI_PROJECT_DIR}/.go-cache

cache:
  key: go-${CI_COMMIT_REF_SLUG}
  paths:
    - .go-cache/

# ── Stage: verify ────────────────────────────────────────────────────────────
# All verify jobs run on GitLab shared Docker runners (NOT the prod shell runner).
# The default image (golang:1.24-alpine) provides Go toolchain.

lint:
  stage: verify
  before_script:
    - export PATH=$PATH:$(go env GOPATH)/bin
    - curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b $(go env GOPATH)/bin latest
  script:
    - golangci-lint run ./...
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

vet:
  stage: verify
  script:
    - go vet ./...
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

test:
  stage: verify
  services:
    - name: postgres:16-alpine
      alias: postgres
      variables:
        POSTGRES_DB: argus_test
        POSTGRES_USER: argus
        POSTGRES_PASSWORD: argus_test
  variables:
    EVENT_COLLECTOR_PG_HOST: postgres
    EVENT_COLLECTOR_PG_DATABASE: argus_test
    EVENT_COLLECTOR_PG_USERNAME: argus
    EVENT_COLLECTOR_PG_PASSWORD: argus_test
    EVENT_COLLECTOR_JWT_SIGNING_KEY: test-jwt-signing-key-32-chars-ok
    GOFLAGS: "-count=1"
    GOPATH: "${CI_PROJECT_DIR}/.go-cache"
  script:
    - go test -race -coverprofile=coverage.out ./...
    - go tool cover -func=coverage.out | tail -1
  coverage: '/total:\s+\(statements\)\s+(\d+\.\d+)%/'
  artifacts:
    paths:
      - coverage.out
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

security-scan:
  stage: verify
  image: securego/gosec:latest
  script:
    - cd ${CI_PROJECT_DIR} && gosec -fmt sarif -out gosec.sarif ./... || true
  artifacts:
    reports:
      sast: gosec.sarif
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

# ── Stage: deploy ────────────────────────────────────────────────────────────
# Rsync code to server + rebuild Docker container.
# Bypasses git on the server (avoids ownership/permission issues).

deploy-production:
  stage: deploy
  image: alpine:3.20
  needs:
    - job: lint
      optional: true
    - job: vet
    - job: test
    - job: security-scan
      optional: true
  before_script:
    - apk add --no-cache openssh-client rsync
    - eval $(ssh-agent -s)
    - chmod 600 "${DEPLOY_SSH_KEY}"
    - ssh-add "${DEPLOY_SSH_KEY}"
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -H ${DEPLOY_HOST} >> ~/.ssh/known_hosts 2>/dev/null
  script:
    - |
      SERVICE="backend"
      BUILD_DIR="/home/${DEPLOY_USER}/builds/${SERVICE}"

      echo "═══════════════════════════════════════════════════════════"
      echo "  Deploying backend to ${DEPLOY_HOST}"
      echo "  Commit: ${CI_COMMIT_SHORT_SHA}"
      echo "═══════════════════════════════════════════════════════════"

      # Step 1: Rsync to deploy user's home (writable)
      echo "→ Syncing code to ${BUILD_DIR}..."
      ssh -o StrictHostKeyChecking=no ${DEPLOY_USER}@${DEPLOY_HOST} "mkdir -p ${BUILD_DIR}"
      rsync -azO --delete \
        --exclude='.git' \
        --exclude='.go-cache' \
        ${CI_PROJECT_DIR}/ \
        ${DEPLOY_USER}@${DEPLOY_HOST}:${BUILD_DIR}/

      # Step 2: Build Docker image from build dir, then restart via compose
      echo "→ Rebuilding Docker container..."
      ssh -o StrictHostKeyChecking=no ${DEPLOY_USER}@${DEPLOY_HOST} "
        set -e
        cd ${BUILD_DIR}
        docker build --no-cache -t argus/${SERVICE}:latest -f Dockerfile . 2>&1

        # Auto-initialize infra if it doesn't exist
        if [ ! -d "~/argus-infra/docker" ]; then
          echo "→ Auto-initializing ~/argus-infra infrastructure repository..."
          mkdir -p ~/argus-infra
          cd ~/argus-infra
          if [ ! -d ".git" ]; then
            git clone https://oauth2:REDACTED_GITLAB_TOKEN@gitlab.com/argus_ai_group/argus-infra.git .
            cp docker/.env.example docker/.env || true
          fi
        fi

        cd ~/argus-infra/docker
        docker compose up -d --no-deps --no-build ${SERVICE} 2>&1

        echo '→ Waiting for container to become healthy...'
        for i in \$(seq 1 20); do
          sleep 6
          health=\$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}no-healthcheck{{end}}' argus-${SERVICE} 2>/dev/null)
          if [ \"\$health\" = 'healthy' ]; then
            echo \"✓ Container healthy after \$((i * 6))s\"
            exit 0
          fi
          echo \"  Attempt \$i/20: health=\$health\"
        done
        echo 'DEPLOY FAILED: container did not become healthy'
        docker logs --tail=20 argus-${SERVICE} 2>&1
        exit 1
      "

      echo "═══════════════════════════════════════════════════════════"
      echo "  ✓ DEPLOY SUCCESS: backend (${CI_COMMIT_SHORT_SHA})"
      echo "═══════════════════════════════════════════════════════════"
  environment:
    name: production
    url: https://argusai.kz
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
