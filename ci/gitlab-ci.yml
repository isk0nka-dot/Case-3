# =============================================================================
# argus-frontend — GitLab CI/CD Pipeline
# =============================================================================
#
# Stages:
#   1. verify  — lint, typecheck
#   2. build   — Nuxt production build + Docker image
#   3. publish — push image to registry
#   4. deploy  — trigger argus-infra deployment
#
# Required CI variables:
#   REGISTRY_HOST         Container registry hostname
#   REGISTRY_USER         Registry username
#   REGISTRY_PASSWORD     Registry password / access token
#   NUXT_PUBLIC_API_BASE_URL  Backend API URL for production build
#   INFRA_TRIGGER_TOKEN   Token for triggering argus-infra deploy pipeline

image: node:22-alpine

stages:
  - verify
  - build
  - publish
  - deploy

variables:
  IMAGE_NAME: argus/frontend
  NPM_CACHE: ${CI_PROJECT_DIR}/.npm-cache

cache:
  key: npm-${CI_COMMIT_REF_SLUG}
  paths:
    - .npm-cache/
    - node_modules/

# ── Stage: verify ─────────────────────────────────────────────────────────────

install:
  stage: verify
  before_script:
    - npm config set cache ${NPM_CACHE}
  script:
    - npm ci --ignore-scripts
  artifacts:
    paths:
      - node_modules/
    expire_in: 1 hour

lint:
  stage: verify
  needs: [install]
  script:
    - npm run lint

typecheck:
  stage: verify
  needs: [install]
  script:
    - npm run typecheck

# ── Stage: build ──────────────────────────────────────────────────────────────

build-nuxt:
  stage: build
  needs: [install, lint, typecheck]
  variables:
    # Use the CI variable for the production API URL.
    # Frontend developers: this URL points to argus-backend. No backend code here.
    NUXT_PUBLIC_API_BASE_URL: ${NUXT_PUBLIC_API_BASE_URL:-https://api.argus.ai}
    NODE_ENV: production
  script:
    - npm run build
  artifacts:
    paths:
      - .output/
    expire_in: 1 hour

build-image:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    NUXT_PUBLIC_API_BASE_URL: ${NUXT_PUBLIC_API_BASE_URL:-https://api.argus.ai}
  script:
    - docker build
      --build-arg NUXT_PUBLIC_API_BASE_URL=${NUXT_PUBLIC_API_BASE_URL}
      --cache-from ${REGISTRY_HOST}/${IMAGE_NAME}:latest
      -t ${REGISTRY_HOST}/${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA}
      -t ${REGISTRY_HOST}/${IMAGE_NAME}:${CI_COMMIT_TAG:-latest}
      .
  needs: []
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

# ── Stage: publish ────────────────────────────────────────────────────────────

publish-image:
  stage: publish
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - echo "${REGISTRY_PASSWORD}" | docker login ${REGISTRY_HOST} -u ${REGISTRY_USER} --password-stdin
  script:
    - docker push ${REGISTRY_HOST}/${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA}
    - docker push ${REGISTRY_HOST}/${IMAGE_NAME}:${CI_COMMIT_TAG:-latest}
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

# ── Stage: deploy ─────────────────────────────────────────────────────────────

trigger-infra-deploy:
  stage: deploy
  trigger:
    project: argus-ai/argus-infra
    branch: main
    strategy: depend
  variables:
    FRONTEND_TAG: ${CI_COMMIT_TAG:-${CI_COMMIT_SHORT_SHA}}
  rules:
    - if: $CI_COMMIT_TAG
