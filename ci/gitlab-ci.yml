# =============================================================================
# argus-infra — GitLab CI/CD Pipeline
# =============================================================================
#
# This pipeline manages infrastructure-level changes, NOT application deploys.
# Application deploys (backend/frontend) are handled by their own repos.
#
# Pipeline: validate → sync → migrate
#
#   validate (automatic on MR + main):
#     docker compose config syntax check
#
#   sync (manual on main):
#     rsync compose files, nginx config, migrations, scripts to the server
#
#   migrate (manual on main, after sync):
#     Run PostgreSQL + ClickHouse migrations via docker exec
#
# Use this pipeline when you change:
#   - docker-compose.yaml / docker-compose.prod.yml
#   - nginx/nginx.conf
#   - migrations/postgres/*.sql or migrations/clickhouse/*.sql
#   - scripts/deploy.sh or any other scripts/
#   - docker/redis.conf, docker/clickhouse/*.xml
#
# Required CI variables (set at GitLab Group level):
#   DEPLOY_HOST       Production server IP (e.g. 157.180.46.33)
#   DEPLOY_USER       SSH user (e.g. root or deploy)
#   DEPLOY_SSH_KEY    SSH private key (type: File, protected + masked)
# =============================================================================

stages:
  - validate
  - sync
  - migrate

variables:
  DEPLOY_PATH: /opt/argus-ai

# ── Stage: validate ──────────────────────────────────────────────────────────
# Checks that docker-compose.yaml + prod overlay parse without errors.
# Runs on every MR and main push — no server access needed.

validate-compose:
  stage: validate
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    # Dummy secrets so compose config doesn't complain about missing env vars
    JWT_SIGNING_KEY: "ci-validation-only-not-real-32chars!"
    MINIO_ROOT_PASSWORD: "ci-validation-only"
    POSTGRES_PASSWORD: "ci-validation-only"
    LIVEKIT_API_SECRET: "ci-validation-only-must-be-long-enough"
  script:
    - cd docker
    - docker compose -f docker-compose.yaml config --quiet
    - docker compose -f docker-compose.yaml -f docker-compose.prod.yml config --quiet
    - echo "✓ Compose config is valid"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ── Stage: sync ──────────────────────────────────────────────────────────────
# Copies infrastructure files from this repo to the production server.
# Manual gate — you must click "Run" in the GitLab UI.

sync-infra:
  stage: sync
  image: alpine:3.20
  before_script:
    - apk add --no-cache openssh-client rsync
    - eval $(ssh-agent -s)
    - chmod 600 "${DEPLOY_SSH_KEY}"
    - ssh-add "${DEPLOY_SSH_KEY}"
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -H ${DEPLOY_HOST} >> ~/.ssh/known_hosts 2>/dev/null
  script:
    - |
      echo "═══════════════════════════════════════════════════════════"
      echo "  Syncing infrastructure to ${DEPLOY_HOST}:${DEPLOY_PATH}"
      echo "═══════════════════════════════════════════════════════════"

      # ── Docker compose files + configs ──
      echo "→ Syncing docker/ (compose, redis, clickhouse configs)..."
      rsync -avzO --exclude='.env' --exclude='keys/' \
        docker/docker-compose.yaml \
        docker/docker-compose.prod.yml \
        docker/redis.conf \
        ${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/argus-infra/docker/

      # Sync clickhouse config XMLs
      rsync -avzO \
        docker/clickhouse/ \
        ${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/argus-infra/docker/clickhouse/

      # ── Nginx config ──
      echo "→ Syncing nginx/"
      rsync -avzO \
        nginx/ \
        ${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/argus-infra/nginx/

      # ── Migrations ──
      echo "→ Syncing migrations/"
      rsync -avzO \
        migrations/ \
        ${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/argus-infra/migrations/

      # ── Scripts ──
      echo "→ Syncing scripts/"
      rsync -avzO \
        scripts/ \
        ${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/argus-infra/scripts/

      # Ensure deploy script is executable
      ssh -o StrictHostKeyChecking=no ${DEPLOY_USER}@${DEPLOY_HOST} "
        chmod +x ${DEPLOY_PATH}/argus-infra/scripts/*.sh 2>/dev/null || true
      "

      echo "═══════════════════════════════════════════════════════════"
      echo "  ✓ Sync complete"
      echo "═══════════════════════════════════════════════════════════"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ── Stage: migrate ───────────────────────────────────────────────────────────
# Runs all idempotent SQL migrations via docker exec.
# Manual gate — only runs after sync-infra delivers the latest SQL files.

run-migrations:
  stage: migrate
  image: alpine:3.20
  needs: [sync-infra]
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - chmod 600 "${DEPLOY_SSH_KEY}"
    - ssh-add "${DEPLOY_SSH_KEY}"
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -H ${DEPLOY_HOST} >> ~/.ssh/known_hosts 2>/dev/null
  script:
    - |
      echo "═══════════════════════════════════════════════════════════"
      echo "  Running database migrations on ${DEPLOY_HOST}"
      echo "═══════════════════════════════════════════════════════════"

      ssh -o StrictHostKeyChecking=no ${DEPLOY_USER}@${DEPLOY_HOST} '
        set -e

        MIGRATIONS="/opt/argus-ai/argus-infra/migrations"

        echo "=== PostgreSQL Migrations ==="
        if ls "$MIGRATIONS"/postgres/*.up.sql 1>/dev/null 2>&1; then
          for f in "$MIGRATIONS"/postgres/*.up.sql; do
            echo "  → $(basename "$f")"
            docker exec -i argus-db psql -U admin -d argus_db < "$f" 2>&1 || \
              echo "    ⚠ Warning (expected for idempotent re-runs)"
          done
        else
          echo "  No PostgreSQL migration files found"
        fi

        echo ""
        echo "=== ClickHouse Migrations ==="
        if ls "$MIGRATIONS"/clickhouse/*.up.sql 1>/dev/null 2>&1; then
          for f in "$MIGRATIONS"/clickhouse/*.up.sql; do
            echo "  → $(basename "$f")"
            docker exec -i argus-clickhouse clickhouse-client --multiquery < "$f" 2>&1 || \
              echo "    ⚠ Warning (expected for idempotent re-runs)"
          done
        else
          echo "  No ClickHouse migration files found"
        fi

        echo ""
        echo "=== ✓ Migrations complete ==="
      '
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
