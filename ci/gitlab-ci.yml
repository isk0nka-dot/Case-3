# =============================================================================
# argus-infra — GitLab CI/CD Pipeline
# =============================================================================
#
# This pipeline manages infrastructure-level changes, NOT application deploys.
# Application deploys (backend/frontend) are handled by their own repos.
#
# Pipeline: validate → sync → migrate
#
#   validate (automatic on MR + main):
#     docker compose config syntax check
#
#   sync (manual on main):
#     rsync compose files, nginx config, migrations, scripts to the server
#
#   migrate (manual on main, after sync):
#     Run PostgreSQL + ClickHouse migrations via docker exec
#
# Use this pipeline when you change:
#   - docker-compose.yaml / docker-compose.prod.yml
#   - nginx/nginx.conf
#   - migrations/postgres/*.sql or migrations/clickhouse/*.sql
#   - scripts/deploy.sh or any other scripts/
#   - docker/redis.conf, docker/clickhouse/*.xml
#
# Required CI variables (set at GitLab Group level):
#   ARGUS_DEPLOY_HOST       Production server IP or DNS name
#   ARGUS_DEPLOY_USER       SSH user (e.g. deploy)
#   ARGUS_DEPLOY_SSH_KEY    SSH private key (type: File, protected)
#
# Optional:
#   ARGUS_PROJECT_ROOT      Default: /opt/argus-ai
#   ARGUS_INFRA_DEPLOY_PATH Default: $ARGUS_PROJECT_ROOT/argus-infra
#   ARGUS_CONFIRM_RESET     Must be DELETE_ARGUS_PROJECT to run reset-project
#   ARGUS_RESET_DATA        true removes argus-* Docker volumes, default false
#   ARGUS_RESET_CONFIG      true removes docker/.env and docker/keys, default false
#
# Backward-compatible fallback: DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY,
# DEPLOY_PATH.
# =============================================================================

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

default:
  interruptible: true
  retry:
    max: 1
    when:
      - runner_system_failure
      - stuck_or_timeout_failure

stages:
  - validate
  - sync
  - migrate
  - deploy

variables:
  ARGUS_PROJECT_ROOT: /opt/argus-ai

# ── Stage: validate ──────────────────────────────────────────────────────────
# Checks that docker-compose.yaml + prod overlay parse without errors.
# Runs on every MR and main push — no server access needed.

validate-compose:
  stage: validate
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    # Dummy secrets so compose config doesn't complain about missing env vars
    JWT_SIGNING_KEY: "ci-validation-only-not-real-32chars!"
    MINIO_ROOT_PASSWORD: "ci-validation-only"
    POSTGRES_PASSWORD: "ci-validation-only"
    LIVEKIT_API_SECRET: "ci-validation-only-must-be-long-enough"
  script:
    - cd docker
    - docker compose -f docker-compose.yaml config --quiet
    - docker compose -f docker-compose.yaml -f docker-compose.prod.yml config --quiet
    - echo "✓ Compose config is valid"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ── Stage: sync ──────────────────────────────────────────────────────────────
# Copies infrastructure files from this repo to the production server.
# Manual gate — you must click "Run" in the GitLab UI.

sync-infra:
  stage: sync
  image: alpine:3.20
  before_script:
    - apk add --no-cache openssh-client rsync
  script:
    - sh ci/scripts/sync_infra.sh
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

reset-project:
  stage: sync
  image: alpine:3.20
  before_script:
    - apk add --no-cache openssh-client
  script:
    - sh ci/scripts/reset_project.sh
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual

# ── Stage: migrate ───────────────────────────────────────────────────────────
# Runs all idempotent SQL migrations via docker exec.
# Manual gate — only runs after sync-infra delivers the latest SQL files.

run-migrations:
  stage: migrate
  image: alpine:3.20
  needs: [sync-infra]
  before_script:
    - apk add --no-cache openssh-client
  script:
    - sh ci/scripts/run_migrations.sh
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ── Stage: deploy ────────────────────────────────────────────────────────────
# Syncs Argus+Webizon compose stack, verifies secrets/models/certs,
# pulls registry images, and starts containers with docker compose --wait.

deploy-argus-webizon:
  stage: deploy
  image: alpine:3.20
  timeout: 30 minutes
  needs: [run-migrations]
  before_script:
    - apk add --no-cache openssh-client rsync
  script:
    - sh ci/scripts/deploy_argus_webizon.sh
  environment:
    name: production
    url: https://argusai.kz
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
