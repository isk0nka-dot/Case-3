# =============================================================================
# argus-frontend — GitLab CI/CD Pipeline
# =============================================================================
#
# Pipeline: verify → deploy
#
#   verify (runs on GitLab runner):
#     npm install, lint, typecheck
#
#   deploy (SSHes into production server):
#     Calls /opt/argus/scripts/deploy.sh --service=frontend
#     → git fetch + reset → docker compose build → health check
#     → automatic rollback on failure
#
# Trigger rules:
#   - Merge requests: verify only (no deploy)
#   - Push to main:   verify → deploy (manual approval gate)
#   - Push tag:        verify → deploy (automatic)
#
# Required CI variables (set at GitLab Group level):
#   DEPLOY_HOST       Production server IP (e.g. 157.180.46.33)
#   DEPLOY_USER       SSH user (e.g. root or deploy)
#   DEPLOY_SSH_KEY    SSH private key (type: File, protected + masked)
#
# No container registry is used. Images build on the server from source.
# All secrets live in /opt/argus/docker/.env — never transiting through CI.
# =============================================================================

image: node:22-alpine

stages:
  - verify
  - deploy

variables:
  NPM_CACHE: ${CI_PROJECT_DIR}/.npm-cache

cache:
  key: npm-${CI_COMMIT_REF_SLUG}
  paths:
    - .npm-cache/
    - node_modules/

# ── Stage: verify ────────────────────────────────────────────────────────────
# All verify jobs run on the GitLab runner. No SSH access needed.

install:
  stage: verify
  before_script:
    - npm config set cache ${NPM_CACHE}
  script:
    - npm ci --ignore-scripts
  artifacts:
    paths:
      - node_modules/
    expire_in: 1 hour
  tags:
    - prod
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

lint:
  stage: verify
  needs: [install]
  script:
    - npm run lint
  tags:
    - prod
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

typecheck:
  stage: verify
  needs: [install]
  script:
    - npm run typecheck
  tags:
    - prod
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

# ── Stage: deploy ────────────────────────────────────────────────────────────
# SSHes into the production server and runs deploy.sh
# The script handles: git update, rebuild, health check, rollback

deploy-production:
  stage: deploy
  image: alpine:3.20
  needs:
    - job: lint
    - job: typecheck
  script:
    - |
      # Determine git ref for the deploy
      if [ -n "${CI_COMMIT_TAG}" ]; then
        DEPLOY_REF="refs/tags/${CI_COMMIT_TAG}"
        echo "Deploying tag: ${CI_COMMIT_TAG}"
      else
        DEPLOY_REF="origin/${CI_COMMIT_BRANCH}"
        echo "Deploying branch: ${CI_COMMIT_BRANCH} (commit ${CI_COMMIT_SHORT_SHA})"
      fi

      echo "═══════════════════════════════════════════════════════════"
      echo "  Deploying frontend LOCALLY on prod server"
      echo "  Ref: ${DEPLOY_REF}"
      echo "═══════════════════════════════════════════════════════════"

      /opt/argus/scripts/deploy.sh --service=frontend --ref=${DEPLOY_REF}
  environment:
    name: production
    url: https://argusai.kz
  tags:
    - prod
  rules:
    # Auto-deploy on version tags (v1.0.0, v2.1.3, etc.)
    - if: $CI_COMMIT_TAG
    # Auto deploy on pushes to main
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
