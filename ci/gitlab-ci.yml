# =============================================================================
# argus-frontend — GitLab CI/CD Pipeline
# =============================================================================
#
# Pipeline: verify → build → deploy
#
#   verify:  npm ci, unit tests, lint, typecheck
#   build:   nuxt build → produces .output/
#   deploy:  rsync .output + Dockerfile to server, docker build, docker compose up
#
# Trigger rules:
#   - Merge requests: verify only (no deploy)
#   - Push to main:   verify → build → deploy (manual gate)
#   - Push tag:       verify → build → deploy (manual gate)
#
# Required CI variables (project or group level):
#   ARGUS_DEPLOY_HOST     Production server IP or DNS name
#   ARGUS_DEPLOY_USER     SSH user (e.g. deploy)
#   ARGUS_DEPLOY_SSH_KEY  SSH private key (type: File, protected)
#
# Optional CI variables:
#   NUXT_PUBLIC_API_BASE_URL  Backend API URL (default: https://argusai.kz)
#   ARGUS_PROJECT_ROOT        Default: /opt/argus-ai
#   ARGUS_FRONTEND_DEPLOY_PATH Default: $ARGUS_PROJECT_ROOT/argus-frontend
#
# Backward-compatible fallback: DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY.
# =============================================================================

image: node:22-alpine

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

default:
  interruptible: true
  retry:
    max: 1
    when:
      - runner_system_failure
      - stuck_or_timeout_failure

stages:
  - verify
  - build
  - deploy

variables:
  NPM_CACHE: ${CI_PROJECT_DIR}/.npm-cache

cache:
  key: npm-${CI_COMMIT_REF_SLUG}
  paths:
    - .npm-cache/
    - node_modules/

# ── Stage: verify ─────────────────────────────────────────────────────────────

install:
  stage: verify
  timeout: 10 minutes
  before_script:
    - npm config set cache ${NPM_CACHE}
  script:
    - npm ci --ignore-scripts
  artifacts:
    paths:
      - node_modules/
    expire_in: 1 hour
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

lint:
  stage: verify
  timeout: 10 minutes
  needs: [install]
  script:
    - npx nuxt prepare
    - npm run lint
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

typecheck:
  stage: verify
  timeout: 10 minutes
  needs: [install]
  script:
    - npx nuxt prepare
    - npm run typecheck
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

unit-test:
  stage: verify
  timeout: 10 minutes
  needs: [install]
  script:
    - node --test tests/unit/*.mjs
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

# ── Stage: build ──────────────────────────────────────────────────────────────

build-production:
  stage: build
  timeout: 15 minutes
  needs:
    - job: install
      artifacts: true
    - job: lint
      artifacts: false
    - job: typecheck
      artifacts: false
    - job: unit-test
      artifacts: false
  before_script:
    - npm config set cache ${NPM_CACHE}
  script:
    - |
      export NUXT_PUBLIC_API_BASE_URL="${NUXT_PUBLIC_API_BASE_URL:-https://argusai.kz}"
      echo "→ Building Nuxt app (API: ${NUXT_PUBLIC_API_BASE_URL})..."
      npm run build
      echo "→ Build complete. Output size:"
      du -sh .output/
  artifacts:
    paths:
      - .output/
    expire_in: 1 hour
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

# ── Stage: deploy ─────────────────────────────────────────────────────────────
# Запускается ВРУЧНУЮ через кнопку в GitLab UI после прохождения verify + build.

deploy-production:
  stage: deploy
  image: alpine:3.20
  timeout: 15 minutes
  needs:
    - job: build-production
      artifacts: true
    - job: typecheck
      artifacts: false
    - job: lint
      artifacts: false
    - job: unit-test
      artifacts: false
  before_script:
    - apk add --no-cache openssh-client rsync
  script:
    - sh ci/scripts/deploy_frontend.sh
  environment:
    name: production
    url: https://argusai.kz
  rules:
    - if: $CI_COMMIT_TAG
      when: manual
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
