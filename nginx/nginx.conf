user nginx;
# =============================================================================
# Argus AI — Nginx Reverse Proxy Configuration
#
# Topology (Docker nginx on argus-network):
#   Browser -> Nginx (:443) -> frontend (:3000) [UI assets + SSR]
#                            -> backend  (:8080) [/api/* REST endpoints]
#                            -> backend  (:50051) [gRPC-Web /argus.proctoring.*]
#
# SSL: managed by Certbot (Let's Encrypt)
# =============================================================================

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ── Logging ─────────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    # ── Performance ──────────────────────────────────────────────────────────
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml application/wasm;

    # ── Rate limiting zones ──────────────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api:10m rate=100r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;

    # ── Upstream definitions ─────────────────────────────────────────────────
    # Nginx runs inside Docker — use Compose service DNS names.
    upstream argus_frontend {
        server frontend:3000;
        keepalive 32;
    }

    upstream argus_backend_http {
        server backend:8080;
        keepalive 64;
    }

    upstream argus_backend_grpc {
        server backend:50051;
        keepalive 32;
    }

    # ── Default HTTP health endpoint for Docker healthcheck ──────────────────
    server {
        listen 80 default_server;
        server_name _;

        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        return 444;
    }

    # ── HTTP → HTTPS redirect ────────────────────────────────────────────────
    server {
        listen 80;
        server_name argusai.kz www.argusai.kz;

        if ($host = www.argusai.kz) {
            return 301 https://$host$request_uri;
        }
        if ($host = argusai.kz) {
            return 301 https://$host$request_uri;
        }

        return 404;
    }
    # ── argusai.kz HTTPS ─────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        server_name argusai.kz www.argusai.kz;

        # SSL — managed by Certbot
        ssl_certificate     /etc/letsencrypt/live/argusai.kz/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/argusai.kz/privkey.pem;
        include /etc/letsencrypt/options-ssl-nginx.conf;
        ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

        # ── Security Headers ─────────────────────────────────────────────────
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "0" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # ── gRPC-Web: forward to backend ─────────────────────────────────────
        location /argus.proctoring {
            grpc_pass grpc://argus_backend_grpc;
            grpc_set_header Host $host;
            grpc_set_header X-Real-IP $remote_addr;
            grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            grpc_set_header X-Forwarded-Proto $scheme;
            grpc_read_timeout 300s;
            grpc_send_timeout 300s;
            limit_req zone=api burst=200 nodelay;
        }

        # ── /api exact match → frontend Nuxt page (super admin route) ──────
        # nginx автоматически делает 301 /api → /api/ без этого блока,
        # что ломает Nuxt страницу /api и отдаёт 404 от бэкенда.
        location = /api {
            proxy_pass http://argus_frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/v1/auth/login {
            limit_req zone=auth burst=10 nodelay;
            proxy_pass http://argus_backend_http;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── REST API: forward to backend ─────────────────────────────────────
        location /api/ {
            proxy_pass http://argus_backend_http;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            limit_req zone=api burst=200 nodelay;
        }

        # ── Frontend: all other requests ─────────────────────────────────────
        location / {
            proxy_pass http://argus_frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
