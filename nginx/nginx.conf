# =============================================================================
# Argus AI — Nginx Reverse Proxy Configuration
#
# Topology:
#   Browser → Nginx (:443) → argus-frontend (:3000)  [UI assets + SSR]
#                          → argus-backend  (:8080)  [/api/* REST endpoints]
#                          → argus-backend  (:50051) [gRPC-Web /argus.proctoring.*]
#
# Security:
#   - TLS termination at Nginx (Let's Encrypt / self-signed in dev)
#   - Strict CSP, HSTS, X-Frame-Options, X-Content-Type-Options
#   - Rate limiting on API endpoints
#   - gRPC-Web proxying with required Content-Type filter
# =============================================================================

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ── Logging ─────────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    # ── Performance ──────────────────────────────────────────────────────────
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml application/wasm;

    # ── Rate limiting zones ──────────────────────────────────────────────────
    # General API: 100 req/s per IP
    limit_req_zone $binary_remote_addr zone=api:10m rate=100r/s;
    # Auth endpoints: 5 req/s per IP (brute-force protection)
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;

    # ── Upstream definitions ─────────────────────────────────────────────────
    upstream argus_frontend {
        server frontend:3000;
        keepalive 32;
    }

    upstream argus_backend_http {
        server backend:8080;
        keepalive 64;
    }

    # ── HTTP → HTTPS redirect ────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        # Let's Encrypt ACME challenge must be served over plain HTTP.
        # Certbot places challenge tokens in /var/www/certbot/.
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Everything else redirects to HTTPS.
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── Main HTTPS server ────────────────────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name argusai.kz www.argusai.kz;

        # ── TLS ──────────────────────────────────────────────────────────────
        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_stapling        on;
        ssl_stapling_verify on;

        # ── Security Headers ─────────────────────────────────────────────────
        # HSTS: enforce HTTPS for 2 years, including subdomains
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

        # Block MIME-sniffing
        add_header X-Content-Type-Options "nosniff" always;

        # Block iframe embedding (clickjacking)
        add_header X-Frame-Options "DENY" always;

        # Disable legacy XSS auditor (CSP is the modern replacement)
        add_header X-XSS-Protection "0" always;

        # Referrer policy: send origin only on cross-origin requests
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Permissions policy: restrict sensitive APIs
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

        # Content Security Policy
        # Allows: same-origin scripts/styles, backend API, LiveKit WebSocket,
        #         fonts from Google Fonts (if used). Tighten for production.
        add_header Content-Security-Policy
            "default-src 'self'; "
            "script-src 'self' 'unsafe-inline'; "
            "style-src 'self' 'unsafe-inline'; "
            "img-src 'self' data: blob:; "
            "connect-src 'self' https://argusai.kz wss://argusai.kz; "
            "media-src 'self' blob:; "
            "worker-src 'self' blob:; "
            "frame-ancestors 'none';"
            always;

        # ── gRPC-Web: forward to backend ─────────────────────────────────────
        # gRPC-Web requests use POST with Content-Type: application/grpc-web*
        location /argus.proctoring {
            grpc_pass grpc://backend:50051;

            grpc_set_header Host $host;
            grpc_set_header X-Real-IP $remote_addr;
            grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            grpc_set_header X-Forwarded-Proto $scheme;

            # gRPC timeout
            grpc_read_timeout 300s;
            grpc_send_timeout 300s;

            limit_req zone=api burst=200 nodelay;
        }

        # ── REST API: forward to backend ─────────────────────────────────────
        location /api/ {
            proxy_pass http://argus_backend_http;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # Rate limiting
            limit_req zone=api burst=200 nodelay;

            # Stricter rate limiting on auth endpoints
            location /api/v1/auth/login {
                limit_req zone=auth burst=10 nodelay;
                proxy_pass http://argus_backend_http;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }
        }

        # ── Health check: forward to backend ─────────────────────────────────
        location ~ ^/(healthz|readyz|metrics) {
            proxy_pass http://argus_backend_http;
            proxy_set_header Host $host;
            # Restrict /metrics to internal network
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            allow 127.0.0.1;
            deny all;
        }

        # ── Frontend: all other requests ─────────────────────────────────────
        location / {
            proxy_pass http://argus_frontend;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # HMR WebSocket (dev only — remove in production)
            proxy_read_timeout 86400;
        }
    }
}
