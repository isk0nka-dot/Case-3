user www-data;
# =============================================================================
# Argus AI — Nginx Reverse Proxy Configuration
#
# Topology (system nginx, not Docker):
#   Browser → Nginx (:443) → argus-frontend (:3000)  [UI assets + SSR]
#                          → argus-backend  (:8080)  [/api/* REST endpoints]
#                          → argus-backend  (:50051) [gRPC-Web /argus.proctoring.*]
#   Browser → Nginx (:443) → webizon-frontend (:3001) [Webizon UI]
#                          → webizon-backend  (:8081) [/api/* REST endpoints]
#
# SSL: managed by Certbot (Let's Encrypt)
# =============================================================================

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ── Logging ─────────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    # ── Performance ──────────────────────────────────────────────────────────
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml application/wasm;

    # ── Rate limiting zones ──────────────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api:10m rate=100r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;

    # ── Upstream definitions ─────────────────────────────────────────────────
    # Nginx runs as a system service — use 127.0.0.1 to reach Docker containers
    upstream argus_frontend {
        server 127.0.0.1:3000;
        keepalive 32;
    }

    upstream argus_backend_http {
        server 127.0.0.1:8080;
        keepalive 64;
    }

    upstream webizon_frontend {
        server 127.0.0.1:3001;
        keepalive 32;
    }

    upstream webizon_backend_http {
        server 127.0.0.1:8081;
        keepalive 64;
    }

    # ── HTTP → HTTPS redirect ────────────────────────────────────────────────
    server {
        listen 80;
        server_name argusai.kz www.argusai.kz;

        if ($host = www.argusai.kz) {
            return 301 https://$host$request_uri;
        }
        if ($host = argusai.kz) {
            return 301 https://$host$request_uri;
        }

        return 404;
    }

    server {
        listen 80;
        server_name webizon.net www.webizon.net;

        if ($host = www.webizon.net) {
            return 301 https://$host$request_uri;
        }
        if ($host = webizon.net) {
            return 301 https://$host$request_uri;
        }

        return 404;
    }

    # BEGIN EDUSERBOOKS
    server {
        listen 80;
        server_name eduserbooks.kz www.eduserbooks.kz;
        client_max_body_size 12m;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name eduserbooks.kz www.eduserbooks.kz;
        client_max_body_size 12m;

        ssl_certificate /etc/letsencrypt/live/eduserbooks.kz/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/eduserbooks.kz/privkey.pem;
        include /etc/letsencrypt/options-ssl-nginx.conf;
        ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

        location / {
            proxy_pass http://127.0.0.1:3003;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }
    }
    # END EDUSERBOOKS

    # ── argusai.kz HTTPS ─────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        server_name argusai.kz www.argusai.kz;

        # SSL — managed by Certbot
        ssl_certificate     /etc/letsencrypt/live/argusai.kz/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/argusai.kz/privkey.pem;
        include /etc/letsencrypt/options-ssl-nginx.conf;
        ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

        # ── Security Headers ─────────────────────────────────────────────────
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "0" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # ── Argus SDK — static JS bundle served with CORS ────────────────────
        location /sdk/ {
            root /var/www/argus-sdk;
            add_header Access-Control-Allow-Origin "*" always;
            add_header Cache-Control "public, max-age=300" always;
            expires 5m;
            try_files $uri =404;
        }

        # ── gRPC-Web: forward to backend ─────────────────────────────────────
        location /argus.proctoring {
            grpc_pass grpc://127.0.0.1:50051;
            grpc_set_header Host $host;
            grpc_set_header X-Real-IP $remote_addr;
            grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            grpc_set_header X-Forwarded-Proto $scheme;
            grpc_read_timeout 300s;
            grpc_send_timeout 300s;
            limit_req zone=api burst=200 nodelay;
        }

        # ── /api exact match → frontend Nuxt page (super admin route) ──────
        # nginx автоматически делает 301 /api → /api/ без этого блока,
        # что ломает Nuxt страницу /api и отдаёт 404 от бэкенда.
        location = /api {
            proxy_pass http://argus_frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── REST API: forward to backend ─────────────────────────────────────
        location /api/ {
            proxy_pass http://argus_backend_http;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            limit_req zone=api burst=200 nodelay;

            location /api/v1/auth/login {
                limit_req zone=auth burst=10 nodelay;
                proxy_pass http://argus_backend_http;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }
        }

        # ── Health endpoints → backend ───────────────────────────────────────
        location = /healthz {
            proxy_pass http://argus_backend_http;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            access_log off;
        }

        location = /readyz {
            proxy_pass http://argus_backend_http;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            access_log off;
        }

        # ── gRPC-Web EventCollector (HTTP/1.1 POST, not native gRPC) ─────────
        location /argus.eventcollector.v1.EventCollectorService/ {
            proxy_pass http://argus_backend_http;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            limit_req zone=api burst=200 nodelay;
        }

        # ── LiveKit WebSocket signaling ──────────────────────────────────────
        # /livekit        → livekit:7880/
        # /livekit/       → livekit:7880/
        # /livekit/rtc?.. → livekit:7880/rtc?..
        location ~ ^/livekit {
            rewrite ^/livekit/?(.*)$ /$1 break;
            proxy_pass http://127.0.0.1:7880;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # ── Frontend: all other requests ─────────────────────────────────────
        location / {
            proxy_pass http://argus_frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ── webizon.net HTTPS ─────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        server_name webizon.net www.webizon.net;

        # SSL — managed by Certbot
        ssl_certificate     /etc/letsencrypt/live/webizon.net/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/webizon.net/privkey.pem;
        include /etc/letsencrypt/options-ssl-nginx.conf;
        ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

        # ── Keycloak OAuth/OIDC endpoints ─────────────────────────────────────
        location /realms/ {
            proxy_pass http://127.0.0.1:8180;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port 443;
        }

        # ── Keycloak login page static assets ────────────────────────────────
        location /resources/ {
            proxy_pass http://127.0.0.1:8180;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port 443;
        }

        # ── MinIO S3 bucket paths ───────────────────────────────────────────
        # Presigned S3 URLs include the exact host/path in the signature.
        # Keep bucket paths unchanged and forward Host so browser URLs like
        # https://webizon.net/webizon-covers/... validate inside MinIO.
        location ~ ^/(webizon-covers|webizon-cta-files|webizon-recordings|webizon-invoices)/ {
            proxy_pass http://127.0.0.1:9010;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_request_buffering off;
            client_max_body_size 512m;
        }

        # ── Webizon Frontend ─────────────────────────────────────────────────
        location / {
            proxy_pass http://webizon_frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }

        # ── Webizon Backend API ───────────────────────────────────────────────
        # Frontend calls /api/backend/*; backend expects /api/*.
        location /api/backend/ {
            proxy_pass http://webizon_backend_http/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Direct backend API access, preserving the /api prefix.
        location /api/ {
            proxy_pass http://webizon_backend_http;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
